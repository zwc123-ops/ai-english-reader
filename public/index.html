<!doctype html>
<html lang="zh-CN" data-theme="sepia">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 英语精读阅读器</title>
    <meta name="description" content="专注英文原版精读的阅读器：支持 EPUB/TXT/PDF 导入、语境查词、AI 长难句与段落精讲、高亮笔记与 SM-2 闪卡复习。" />
    <meta property="og:title" content="AI 英语精读阅读器" />
    <meta property="og:description" content="专注英文原版精读的阅读器：支持 EPUB/TXT/PDF 导入、语境查词、AI 长难句与段落精讲、高亮笔记与 SM-2 闪卡复习。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="nav-rail" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">R</div>
          <div class="brand-text">
            <strong>精读器</strong>
            <span>English Reader</span>
          </div>
        </div>
        <nav class="nav-list">
          <button class="nav-item is-active" data-view="library">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
            <span>书库</span>
          </button>
          <button class="nav-item" data-view="reader">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>阅读</span>
          </button>
          <button class="nav-item" data-view="vocabulary">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
            <span>生词</span>
          </button>
          <button class="nav-item" data-view="notes">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
            <span>笔记</span>
          </button>
          <button class="nav-item" data-view="settings">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>设置</span>
          </button>
        </nav>

        <div class="nav-footer">
          <div class="theme-switcher" role="group" aria-label="界面主题">
            <button class="theme-btn" data-quick-theme="light" title="浅色主题">浅色</button>
            <button class="theme-btn" data-quick-theme="sepia" title="米色主题">米色</button>
            <button class="theme-btn" data-quick-theme="dark" title="深色主题">深色</button>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <section id="libraryView" class="view is-active" aria-label="书库"></section>
        <section id="readerView" class="view" aria-label="阅读器"></section>
        <section id="vocabularyView" class="view" aria-label="生词本"></section>
        <section id="notesView" class="view" aria-label="高亮与笔记"></section>
        <section id="settingsView" class="view" aria-label="设置"></section>
      </main>
    </div>

    <div id="selectionToolbar" class="selection-toolbar" role="toolbar" aria-label="选区操作" hidden>
      <button type="button" data-action="lookup">查词</button>
      <button type="button" data-action="sentence">分析句子</button>
      <button type="button" data-action="paragraph">解释段落</button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button type="button" data-action="highlight">高亮</button>
      <button type="button" data-action="add-note">记笔记</button>
      <button type="button" data-action="tts-selection">朗读</button>
    </div>

    <div id="noteModal" class="modal-backdrop" hidden>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="noteModalTitle">
        <div class="modal-header">
          <h2 id="noteModalTitle">添加读书笔记</h2>
          <button type="button" id="noteModalClose" class="btn ghost icon-btn" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <blockquote id="noteModalQuote" class="note-quote"></blockquote>
          <div class="field">
            <label for="noteModalInput">笔记内容</label>
            <textarea id="noteModalInput" class="textarea" rows="4" placeholder="记录你对这句话的理解、疑问或感悟..."></textarea>
          </div>
          <div class="color-picker-row" role="radiogroup" aria-label="高亮颜色">
            <button type="button" class="color-swatch is-selected" data-hl-color="amber" title="暖黄"></button>
            <button type="button" class="color-swatch" data-hl-color="teal" title="青绿"></button>
            <button type="button" class="color-swatch" data-hl-color="blue" title="浅蓝"></button>
            <button type="button" class="color-swatch" data-hl-color="rose" title="浅粉"></button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" id="noteModalDelete" class="btn danger" hidden>删除高亮</button>
          <div class="modal-footer-right">
            <button type="button" id="noteModalCancel" class="btn ghost">取消</button>
            <button type="button" id="noteModalSave" class="btn primary">保存</button>
          </div>
        </div>
      </div>
    </div>

    <div id="toastHost" class="toast-host" aria-live="polite"></div>
    <input id="fileInput" class="file-input" type="file" accept=".txt,.epub,.pdf,text/plain,application/epub+zip,application/pdf" multiple />
    <input id="backupInput" class="file-input" type="file" accept=".json,application/json" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script type="module" src="./js/main.js?v=4"></script>
  </body>
</html>
